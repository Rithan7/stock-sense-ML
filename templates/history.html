<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History — StockSenseML</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0d1117;--card:#161b22;--card2:#1c2128;--border:#30363d;--blue:#4fc3f7;--green:#56d364;--red:#f85149;--amber:#e3b341;--muted:#8b949e;--white:#e6edf3;--purple:#bc8cff;}
body{background:var(--bg);color:var(--white);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
.navbar{background:rgba(22,27,34,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 28px;display:flex;align-items:center;gap:14px;height:58px;position:sticky;top:0;z-index:100;}
.nav-brand{font-family:'Space Mono',monospace;font-size:15px;font-weight:700;color:var(--blue);}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.nav-user{font-size:12px;color:var(--muted);}
.nav-user span{color:var(--blue);font-weight:600;}
.nav-btn{padding:6px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .2s;border:1px solid var(--border);color:var(--muted);}
.nav-btn:hover{border-color:var(--blue);color:var(--blue);}
.nav-btn-red{border-color:rgba(248,81,73,.3);color:var(--red);}
.nav-btn-red:hover{background:rgba(248,81,73,.1);}
.main{padding:28px;max-width:1200px;margin:0 auto;width:100%;flex:1;}
@media(max-width:600px){.main{padding:16px;}}
.page-title{font-family:'Space Mono',monospace;font-size:22px;font-weight:700;color:var(--white);margin-bottom:6px;}
.page-sub{font-size:13px;color:var(--muted);margin-bottom:28px;}
.section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:24px;}
.section-title{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--white);margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.hist-table{width:100%;border-collapse:collapse;font-size:13px;}
.hist-table th{padding:9px 14px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;border-bottom:2px solid var(--border);text-align:left;font-weight:600;}
.hist-table td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
.hist-table tr:last-child td{border-bottom:none;}
.hist-table tr:hover td{background:rgba(255,255,255,.025);}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:4px 12px;border-radius:20px;font-weight:700;}
.badge-up{background:rgba(86,211,100,.15);color:#56d364;border:1px solid rgba(86,211,100,.2);}
.badge-dn{background:rgba(248,81,73,.15);color:#f85149;border:1px solid rgba(248,81,73,.2);}
.badge-model{background:rgba(79,195,247,.12);color:#4fc3f7;font-size:10px;padding:3px 8px;}
.mono{font-family:'Space Mono',monospace;font-size:12px;}
.empty-state{text-align:center;padding:60px 0;color:var(--muted);}
.empty-icon{font-size:40px;margin-bottom:12px;}
.empty-txt{font-size:15px;font-weight:600;color:var(--white);margin-bottom:6px;}
.empty-link{display:inline-block;margin-top:16px;padding:9px 22px;background:var(--blue);color:#0d1117;border-radius:8px;text-decoration:none;font-weight:700;font-size:13px;}
.watchlist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;}
.watch-card{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:16px;transition:all .2s;}
.watch-card:hover{border-color:rgba(79,195,247,.3);transform:translateY(-2px);}
.watch-ticker{font-family:'Space Mono',monospace;font-size:20px;font-weight:700;color:var(--blue);margin-bottom:4px;}
.watch-price{font-family:'Space Mono',monospace;font-size:14px;margin-bottom:2px;}
.watch-change{font-size:11px;margin-bottom:10px;}
.watch-date{font-size:10px;color:var(--muted);margin-bottom:14px;}
.remove-btn{background:transparent;border:1px solid rgba(248,81,73,.3);color:var(--red);border-radius:7px;padding:6px 14px;font-size:11px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;width:100%;}
.remove-btn:hover{background:rgba(248,81,73,.1);}
@keyframes pulse{0%,100%{opacity:.5;}50%{opacity:1;}}
.loading-pulse{animation:pulse 1.2s ease-in-out infinite;color:var(--muted);font-size:13px;padding:30px 0;text-align:center;}
footer{border-top:1px solid var(--border);padding:14px 28px;text-align:center;font-size:11px;color:var(--muted);}
</style>
</head>
<body>
<nav class="navbar">
  <span style="font-size:20px;">📈</span>
  <div class="nav-brand">StockSenseML</div>
  <div class="nav-right">
    <span class="nav-user">Hello, <span>{{ current_user.username }}</span></span>
    <a href="/" class="nav-btn">← Dashboard</a>
    <a href="/search" class="nav-btn">🔍 Search</a>
    <a href="/logout" class="nav-btn nav-btn-red">Logout</a>
  </div>
</nav>
<main class="main">
  <div class="page-title">📋 Prediction History</div>
  <div class="page-sub">Your last 20 model runs — automatically saved after each prediction</div>

  <div class="section">
    <div class="section-title">Recent Predictions</div>
    <div id="hist-wrap"><div class="loading-pulse">Loading predictions…</div></div>
  </div>

  <div class="section">
    <div class="section-title">⭐ My Watchlist</div>
    <div id="watch-wrap"><div class="loading-pulse">Loading watchlist…</div></div>
  </div>
</main>
<footer>StockSenseML · Academic use only · <span style="color:var(--amber);">⚠️ Not financial advice</span></footer>
<script>
async function loadHistory(){
  try{
    const r=await fetch("/api/history");
    const data=await r.json();
    const wrap=document.getElementById("hist-wrap");
    if(!data.length){
      wrap.innerHTML=`<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-txt">No predictions yet</div><div>Run the model on the dashboard to see results here.</div><a href="/" class="empty-link">Go to Dashboard →</a></div>`;
      return;
    }
    wrap.innerHTML=`<div style="overflow-x:auto;"><table class="hist-table"><thead><tr><th>#</th><th>Ticker</th><th>Model</th><th>Accuracy</th><th>AUC</th><th>F1</th><th>Prediction</th><th>P(UP)</th><th>Date</th></tr></thead><tbody>${data.map((p,i)=>`<tr><td class="mono" style="color:var(--muted);">${i+1}</td><td><span style="font-family:'Space Mono',monospace;font-weight:700;color:var(--blue);">${p.ticker}</span></td><td><span class="badge badge-model">${p.model_type}</span></td><td class="mono" style="color:${p.accuracy>=60?"#56d364":p.accuracy>=52?"#e3b341":"#f85149"};">${p.accuracy}%</td><td class="mono" style="color:${p.auc>=0.6?"#4fc3f7":"#e3b341"};">${p.auc.toFixed(3)}</td><td class="mono" style="color:#bc8cff;">${p.f1}%</td><td><span class="badge ${p.prediction_direction==="UP"?"badge-up":"badge-dn"}">${p.prediction_direction==="UP"?"📈 UP":"📉 DOWN"}</span></td><td class="mono" style="color:var(--muted);">${p.prob_up}%</td><td style="color:var(--muted);font-size:12px;">${p.created_at}</td></tr>`).join("")}</tbody></table></div>`;
  }catch(e){document.getElementById("hist-wrap").innerHTML=`<div style="color:var(--red);font-size:13px;">Failed to load history.</div>`;}
}

async function loadWatchlist(){
  try{
    const r=await fetch("/api/watchlist");
    const data=await r.json();
    const wrap=document.getElementById("watch-wrap");
    if(!data.length){
      wrap.innerHTML=`<div class="empty-state"><div class="empty-icon">⭐</div><div class="empty-txt">Your watchlist is empty</div><div>Click the ⭐ Watch button on the dashboard to save stocks.</div><a href="/" class="empty-link">Go to Dashboard →</a></div>`;
      return;
    }
    wrap.innerHTML=`<div class="watchlist-grid" id="watch-grid"></div>`;
    const grid=document.getElementById("watch-grid");
    for(const item of data){
      const card=document.createElement("div");
      card.className="watch-card";card.id=`wc-${item.ticker}`;
      card.innerHTML=`<div class="watch-ticker">${item.ticker}</div><div class="watch-price" id="wp-${item.ticker}" style="color:var(--muted);">Loading…</div><div class="watch-change" id="wch-${item.ticker}"></div><div class="watch-date">Added ${item.added_at}</div><button class="remove-btn" onclick="removeWatch('${item.ticker}')">✕ Remove</button>`;
      grid.appendChild(card);
      fetchWatchPrice(item.ticker);
    }
  }catch(e){document.getElementById("watch-wrap").innerHTML=`<div style="color:var(--red);font-size:13px;">Failed to load watchlist.</div>`;}
}

async function fetchWatchPrice(ticker){
  try{
    const r=await fetch(`/api/liveprice/${ticker}`);const d=await r.json();if(d.error)return;
    const up=d.pct>=0;const cls=up?"#56d364":"#f85149";const ico=up?"▲":"▼";
    const pe=document.getElementById(`wp-${ticker}`);const ce=document.getElementById(`wch-${ticker}`);
    if(pe){pe.textContent=`$${d.price.toFixed(2)}`;pe.style.color=cls;}
    if(ce){ce.textContent=`${ico} ${Math.abs(d.change).toFixed(2)} (${Math.abs(d.pct)}%)`;ce.style.color=cls;}
  }catch(e){}
}

async function removeWatch(ticker){
  if(!confirm(`Remove ${ticker} from your watchlist?`))return;
  try{
    await fetch(`/api/watchlist/${ticker}`,{method:"DELETE"});
    const card=document.getElementById(`wc-${ticker}`);
    if(card){card.style.cssText+="opacity:0;transform:scale(.9);transition:.3s;";setTimeout(()=>card.remove(),300);}
  }catch(e){alert("Failed to remove.");}
}

loadHistory();loadWatchlist();
</script>
</body>
</html>
